<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eaf5ff"><title>NEXUS 2.0</title>
<style>
:root{--ink:#19334d;--muted:#7c94a9;--blue:#8bc9f5;--line:#dcecf8;--glass:rgba(255,255,255,.82)}
*{box-sizing:border-box}body{margin:0;font:15px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(ellipse at 12% 8%,#fff 0,transparent 34%),linear-gradient(145deg,#eaf6ff,#d8edff 55%,#f5fbff);min-height:100vh;overflow:hidden}
.cloud{position:fixed;border-radius:100px;background:#fff9;filter:blur(1px);pointer-events:none}.c1{width:260px;height:75px;top:12%;left:-65px}.c2{width:340px;height:95px;right:-90px;bottom:14%}.c3{width:180px;height:55px;right:22%;top:7%}
.app{height:100dvh;display:grid;grid-template-columns:270px 1fr;gap:14px;padding:14px;position:relative}
.sidebar,.main{background:var(--glass);border:1px solid #fff;border-radius:25px;box-shadow:0 15px 50px #7daed022;backdrop-filter:blur(18px);min-height:0}
.sidebar{padding:20px 15px;display:flex;flex-direction:column;gap:20px}.brand{display:flex;align-items:center;gap:11px;padding:4px 8px}.logo{width:42px;height:42px;border-radius:15px;background:linear-gradient(145deg,#a8dcff,#69b4ed);display:grid;place-items:center;color:white;font-weight:900;font-size:20px;box-shadow:0 7px 18px #72b9ed55}.brand strong{font-size:18px;letter-spacing:2px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px;margin-top:2px}
.primary,.nav button,.side-bottom button{border:0;background:transparent;color:#58748d;text-align:left;padding:12px 13px;border-radius:13px;cursor:pointer;font:inherit;display:flex;align-items:center;gap:11px}.primary{background:#e7f4ff;color:#287eb8;font-weight:700;justify-content:center}.nav{display:grid;gap:5px}.nav button:hover,.nav button.active,.side-bottom button:hover{background:#edf7ff;color:#287eb8}.nav .ico{width:20px;text-align:center}.side-label{font-size:10px;letter-spacing:1.5px;color:#9ab0c2;padding:0 13px;margin-bottom:-12px}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:3px}
.main{display:flex;flex-direction:column;overflow:hidden}.top{height:68px;flex-shrink:0;border-bottom:1px solid #e6f1f9;display:flex;align-items:center;justify-content:space-between;padding:0 25px}.status{font-size:12px;color:#7190a8;display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;border-radius:50%;background:#62c69b;box-shadow:0 0 0 4px #62c69b22}.top-actions{display:flex;gap:8px}.round{border:1px solid var(--line);background:#fff;color:#7190a8;width:36px;height:36px;border-radius:50%;cursor:pointer}
.chat{flex:1;overflow:auto;padding:28px clamp(16px,6vw,90px);display:flex;flex-direction:column;gap:18px}.welcome{margin:auto;text-align:center;max-width:530px}.orb{width:76px;height:76px;margin:0 auto 18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#a9dcff 48%,#6bb9ed);box-shadow:0 0 0 12px #b9e1fb44,0 10px 35px #66b4e955;position:relative}.orb:after{content:"";position:absolute;inset:19px;border:2px solid #fff9;border-radius:50%}.welcome h1{font-size:29px;margin:0 0 9px;letter-spacing:-.7px}.welcome p{color:#7c94a9;line-height:1.6;margin:0}.suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:24px}.suggestions button{border:1px solid #d9ebf8;background:#ffffffb8;color:#63829d;border-radius:20px;padding:9px 13px;cursor:pointer}.message{max-width:min(78%,680px);padding:14px 17px;border-radius:18px;line-height:1.55;white-space:pre-wrap}.user{align-self:flex-end;background:#d9efff;border:1px solid #c5e6fc;border-bottom-right-radius:5px}.assistant{align-self:flex-start;background:#fff;border:1px solid #e4f0f8;border-bottom-left-radius:5px}.composer-wrap{padding:12px clamp(14px,5vw,65px) 22px}.composer{display:flex;align-items:flex-end;gap:10px;padding:10px 12px;background:#fff;border:1px solid #d9eaf6;border-radius:23px;box-shadow:0 8px 25px #83b9df20}.mode{position:relative}.mode>button{border:0;background:#eaf6ff;color:#4789b8;border-radius:18px;padding:10px 13px;font-weight:700;cursor:pointer;white-space:nowrap}.mode-menu{display:none;position:absolute;bottom:49px;left:0;background:white;border:1px solid var(--line);box-shadow:0 12px 35px #416a8822;border-radius:15px;padding:6px;width:205px;z-index:4}.mode-menu.open{display:grid}.mode-menu button{border:0;background:white;text-align:left;padding:10px;border-radius:9px;color:#58748d;cursor:pointer}.mode-menu button:hover{background:#edf7ff}textarea{border:0;outline:0;resize:none;flex:1;min-height:42px;max-height:130px;padding:10px 3px;font:inherit;color:var(--ink);background:transparent}.send{border:0;width:43px;height:43px;border-radius:50%;background:#8bc9f5;color:white;font-size:23px;font-weight:800;cursor:pointer}.hint{text-align:center;font-size:10px;color:#9ab0c2;margin-top:9px}
@media(max-width:760px){.app{grid-template-columns:1fr;padding:8px}.sidebar{display:none}.main{border-radius:20px}.top{height:58px;padding:0 16px}.chat{padding:20px 14px}.message{max-width:90%}.composer-wrap{padding:10px 10px 14px}.welcome h1{font-size:25px}.mode>button{padding:10px;font-size:12px}.composer{gap:6px}.send{width:40px;height:40px}}
</style></head>
<body><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
<div class="app">
<aside class="sidebar"><div class="brand"><div class="logo">N</div><div><strong>NEXUS</strong><small>INTELLIGENCE 2.0</small></div></div>
<button class="primary" id="newChat">＋ Nova conversa</button>
<div class="side-label">ESPAÇO DE TRABALHO</div><nav class="nav"><button class="active"><span class="ico">◌</span> Conversar</button><button><span class="ico">✧</span> Criar</button><button><span class="ico">▤</span> Planejar</button><button><span class="ico">◇</span> Projetos avançados</button><button><span class="ico">♫</span> Música</button></nav>
<div class="side-label">SUA NEXUS</div><nav class="nav"><button><span class="ico">▧</span> Arquivos</button><button><span class="ico">◷</span> Histórico</button><button><span class="ico">⚙</span> Configurações</button></nav>
<div class="side-bottom"><button>ⓘ Ajuda e segurança</button><button>☁ Status do sistema</button></div></aside>
<main class="main"><header class="top"><div class="status"><span class="dot"></span> Ambiente de interface · protótipo</div><div class="top-actions"><button class="round" title="Notificações">♧</button><button class="round" title="Perfil">●</button></div></header>
<section class="chat" id="chat"><div class="welcome" id="welcome"><div class="orb"></div><h1>Olá! Eu sou a NEXUS.</h1><p>Um espaço para conversar, criar ideias e organizar projetos. Como posso ajudar você hoje?</p><div class="suggestions"><button>Me ajude a planejar um projeto</button><button>Crie uma ideia comigo</button><button>Explique algo novo</button></div></div></section>
<div class="composer-wrap"><div class="composer"><div class="mode"><button id="modeBtn">Conversar⌄</button><div class="mode-menu" id="modeMenu"><button>Conversar</button><button>Criar</button><button>Planejar</button><button>Projetos avançados</button><button>Música</button></div></div><textarea id="prompt" rows="1" placeholder="Escreva sua mensagem..."></textarea><button class="send" id="send" aria-label="Enviar">↑</button></div><div class="hint">A NEXUS pode cometer erros. Confira informações importantes.</div></div>
</main></div>
<script>
const chat=document.querySelector('#chat'),input=document.querySelector('#prompt'),menu=document.querySelector('#modeMenu'),modeBtn=document.querySelector('#modeBtn');
function add(text,who){const el=document.createElement('div');el.className='message '+who;el.textContent=text;chat.append(el);chat.scrollTop=chat.scrollHeight}
function send(){const value=input.value.trim();if(!value)return;document.querySelector('#welcome')?.remove();add(value,'user');input.value='';input.style.height='42px';setTimeout(()=>add('A interface da NEXUS está pronta para receber a integração do cérebro, memória, pesquisa e ferramentas. Esta versão visual ainda não está conectada a um serviço de IA.', 'assistant'),350)}
document.querySelector('#send').addEventListener('click',send);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});input.addEventListener('input',()=>{input.style.height='42px';input.style.height=Math.min(input.scrollHeight,130)+'px'});
modeBtn.onclick=()=>menu.classList.toggle('open');menu.querySelectorAll('button').forEach(b=>b.onclick=()=>{modeBtn.textContent=b.textContent+'⌄';menu.classList.remove('open')});document.addEventListener('click',e=>{if(!e.target.closest('.mode'))menu.classList.remove('open')});
document.querySelector('#newChat').onclick=()=>{chat.innerHTML=document.querySelector('#welcome')?.outerHTML||'<div class="welcome" id="welcome"><div class="orb"></div><h1>Olá! Eu sou a NEXUS.</h1><p>O que vamos criar hoje?</p></div>'};
document.querySelectorAll('.suggestions button').forEach(b=>b.onclick=()=>{input.value=b.textContent;send()});
</script></body></html>
